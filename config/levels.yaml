# Key lines. Manual lines carry active_from so history replays never judge a line before it existed.
# User-set; edit only in yearly review. Seeded from the Oct 2026 snapshot (section 7).
defaults:
  buffer_pct: 1.0
  approach_multiple: 2.0
  fail_window_closes: 10      # daily closes back inside within this many closes => failed
  fail_window_monthly_closes: 2   # same rule when only monthly closes exist (research history)

gold:
  - id: gold_jun26_low
    label: "June 2026 low"
    type: manual_price
    value_usd: 3955
    direction: below
    buffer_pct: 1.0
    severity: important
    active_from: 2026-07-01   # the low was only known after it happened
    note: "2026 low. A confirmed break suggests the post-peak fall has a second leg."
  - id: gold_4000_weekly
    label: "Weekly close below $4,000"
    type: weekly_close          # judged on each Friday's futures close, not on monthly averages
    value_usd: 4000
    direction: below
    buffer_pct: 0.0             # the line as traders state it: any weekly close under 4,000
    fail_window_weeks: 2
    severity: important
    active_from: 2026-10-05     # added 10 Oct 2026; alerts only from then on
    since: 2025-11-01           # the page counts weekly closes from here (gold first crossed 4,000 in Oct 2025)
    next_lo_usd: 3500
    next_hi_usd: 3700
    note: "Martin Armstrong (MINING.com, Oct 2026) and StoneX (2 Oct 2026) both say a weekly close under it opens a fall to about $3,500-3,700."
    source: "MINING.com interview with Martin Armstrong, Oct 2026; StoneX, 'Gold breaks down on descending triangle, sets up $4k test', 2 Oct 2026"
  - id: gold_jan26_peak
    label: "January 2026 peak"
    type: manual_price
    value_usd: 5500
    direction: above
    severity: watch
    active_from: 2026-02-01
    note: "2026 intraday peak (approximate)."
  - id: gold_10m_avg
    label: "10-month average (warning light)"
    currencies: [USD]           # both rules are decided on the dollar price (Oct 2026 review)
    type: derived_ma
    window_months: 10
    direction: both
    severity: important
  - id: gold_mom_12_1
    label: "Main switch point (gold vs a year ago at zero)"
    currencies: [USD]
    type: signal_zero_cross
    signal: momentum_12_1
    direction: both
    severity: important
  - id: gold_regime
    label: "Regime label change (USD)"
    type: regime_change
    severity: watch
  - id: gold_stretch_10y
    label: "Gold vs its 10-year average"
    type: stretch_percentile
    measure: dist_10y_avg
    thresholds: [50, 90]
    severity: watch

macro:   # needs FRED data (phase 2); declared now, evaluated once the series exist
  - id: real_yield_jump
    label: "10-year real yield jump"
    type: change_bp
    series: DFII10
    window_months: 3
    threshold_bp: 50
    severity: important
  - id: fed_hikes_priced
    label: "Fed hikes priced"
    type: level
    series: fed_hikes_priced_12m
    threshold: 4
    severity: watch
