# Section 8.1 rules. Fixed before results; change only in yearly review.
regime:
  lookback_months: 12
  er_min: 0.30
  up_return_min: 0.10
  down_return_max: -0.10
  sideways_episode_min_months: 12
  sideways_gap_merge_months: 2

backtest:
  start: "1972-08"            # first month with a full 12-month lookback after the float
  cost_per_switch: 0.002      # section 8 reproduction (long history on monthly averages)
  cash_return: zero           # section 8 reproduction; the page uses cash rates below
  chop_filter_label_lag_months: 1
  # Signals: both rules are decided on the DOLLAR price (monthly averages) for every view;
  # franc results apply the dollar signal to franc prices (Oct 2026 review).
  signal_currency: USD
  main_rule: momentum_12_1    # rule 1 is the main switch; rule 2 (ma_10m) is a warning light
  # Realistic test: signal from monthly averages, traded at real month-end closes
  # (COMEX front-month daily closes, from 2000), cash earning 3-month rates.
  realistic_start: "2001-01"
  cash_series: {USD: us_tbill_3m, CHF: chf_3m_rate}
  # One-way cost of each switch, by how the gold is held. Rough round numbers for a private
  # investor in Switzerland: fund = exchange-traded gold fund (spread + commission);
  # bars = 1 kg bar via a bank (spread about 1% each way); coins = Vreneli / Krugerrand
  # (premium and spread about 2.5% each way). Change in yearly review.
  costs: {fund: 0.002, bars: 0.01, coins: 0.025}
  holding: fund               # which cost the page shows first: fund | bars | coins

stretch:
  percentile_since: "1971-08" # windows use floating-era prices only
  windows_months: {ma_10m: 10, avg_3y: 36, avg_10y: 120}
  rolling_percentile_years: [5, 10]

analogues:
  standardise: zscore         # zscore | rank
  candidate_start: "1975-01"
  exclude_recent_months: 24
  collapse_months: 18
  top_n: 6
  categorical_penalty: 1.0
  group_weights:              # default equal by group
    price_shape: 1.0
    rates_money: 1.0
    inflation: 1.0
    demand_flow: 1.0
    risk: 1.0
    chf: 1.0
  groups:
    price_shape: [fall_from_24m_high, dist_10y_avg, return_3y, dist_10m_avg]
    rates_money: [real_yield_proxy, real_yield_proxy_chg_6m, fed_direction, dollar_chg_6m]
    inflation: [cpi_yoy, oil_chg_12m, breakeven_10y]
    demand_flow: [cb_purchases_12m, etf_holdings_chg_6m, cftc_mm_pct]
    risk: [vix_pct, gpr_pct]
    chf: [chf_dist_10y_avg, usdchf_chg_12m]
  # proxies used where a measure did not exist at the time (never invented values)
  proxies:
    real_yield_10y: real_yield_proxy   # 10y Treasury minus trailing CPI y/y; TIPS only from 1997
  outcome_horizons_months: [3, 6, 12, 24]
