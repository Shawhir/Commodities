# One entry per fetcher. status: verified (fetched and parsed by this code) | candidate (written to
# the documented format, first live run happens on GitHub Actions) | manual (figures entered by hand).
# schedule: daily | weekly | on_release (fetched by `pmdash reports check` when a report is due).
# period + release_lag_days set available_date (see ingest/generic.py).
sources:
  # --- prices: verified -------------------------------------------------------------------
  gold_usd_monthly:
    fetcher: github_gold_monthly
    url: https://raw.githubusercontent.com/datasets/gold-prices/main/data/monthly.csv
    schedule: daily
    stale_after_days: 45
    status: verified
    note: Monthly averages; pre-1968 values are official fixed prices. Research baseline only.
  usdchf_monthly:
    fetcher: github_fx_monthly
    url: https://raw.githubusercontent.com/datasets/exchange-rates/main/data/monthly.csv
    country: Switzerland
    schedule: daily
    stale_after_days: 45
    status: verified
    note: CHF per USD, from 1971.

  # --- history backfill from public mirrors of official series: verified -------------------
  us_cpi_mirror:
    fetcher: csv
    url: https://raw.githubusercontent.com/datasets/cpi-us/main/data/cpiai.csv
    date_col: Date
    value_col: Index
    period: month
    release_lag_days: 15          # BLS publishes CPI around mid-month for the prior month
    schedule: daily
    stale_after_days: 50
    status: verified
    note: US CPI-U, all items, not seasonally adjusted, from 1913 (BLS via datasets/cpi-us).
  us_10y_yield_monthly:
    fetcher: csv
    url: https://raw.githubusercontent.com/datasets/bond-yields-us-10y/main/data/monthly.csv
    date_col: Date
    value_col: Rate
    period: month
    release_lag_days: 1
    schedule: daily
    stale_after_days: 45
    status: verified
    note: 10-year Treasury constant maturity, monthly average, from 1953 (FRED GS10 via datasets).
  vix_daily_mirror:
    fetcher: csv
    url: https://raw.githubusercontent.com/datasets/finance-vix/main/data/vix-daily.csv
    date_col: DATE
    value_col: CLOSE
    period: day
    release_lag_days: 0
    schedule: daily
    stale_after_days: 7
    status: verified
    note: CBOE VIX daily close from 1990.
  brent_monthly:
    fetcher: csv
    url: https://raw.githubusercontent.com/datasets/oil-prices/main/data/brent-monthly.csv
    date_col: Date
    value_col: Price
    period: month
    release_lag_days: 1
    schedule: daily
    stale_after_days: 45
    status: verified
    note: Brent crude, USD per barrel, monthly (EIA via datasets/oil-prices), from 1987.
  wti_monthly:
    fetcher: csv
    url: https://raw.githubusercontent.com/datasets/oil-prices/main/data/wti-monthly.csv
    date_col: Date
    value_col: Price
    period: month
    release_lag_days: 1
    schedule: daily
    stale_after_days: 45
    status: verified
    note: WTI crude, USD per barrel, monthly, from 1986.
  usdchf_daily:
    fetcher: csv
    url: https://raw.githubusercontent.com/datasets/exchange-rates/main/data/daily.csv
    date_col: Date
    value_col: Exchange rate
    filter: {Country: Switzerland}
    period: day
    release_lag_days: 7           # Fed H.10 rates are published weekly
    schedule: daily
    stale_after_days: 14
    status: verified
    note: CHF per USD, daily noon buying rate, from 1971.

  # --- official sources: candidates, run on GitHub Actions -----------------------------------
  us_tbill_3m:        {fetcher: fred, fred_id: TB3MS,           period: month, release_lag_days: 5,  schedule: daily, stale_after_days: 45, status: candidate, note: "3-month US Treasury bill rate, monthly average, % a year, from 1934 (cash earning for time out of gold, USD)"}
  chf_3m_rate:        {fetcher: fred, fred_id: IR3TIB01CHM156N, period: month, release_lag_days: 40, schedule: daily, stale_after_days: 75, status: candidate, note: "3-month Swiss franc interbank rate (OECD), monthly, % a year (Libor CHF, then SARON-based); negative 2015-2022. Cash earning for time out of gold, CHF"}
  # --- who's buying (checked from GitHub Actions with `pmdash probe`, Oct 2026) -----------------
  cb_gold_imf:
    fetcher: imf_gold
    countries: {CHN: cn, IND: in, POL: pl, TUR: tr, CZE: cz, RUS: ru, JPN: jp, USA: us, DEU: de, CHE: ch}
    start: "2000-01"
    release_lag_days: 40
    schedule: weekly
    stale_after_days: 90
    status: candidate
    note: "Central bank gold holdings, tonnes (IMF IRFCL, fine troy ounces / 32,150.7466). Feeds cb_gold_t_<cc>."
  trade_ch_exports:
    fetcher: comtrade_monthly
    reporter: 757
    flow: X
    all_partners: true
    partners: {0: total, 156: cn, 344: hk, 699: in, 826: gb, 842: us, 792: tr, 784: ae, 682: sa, 702: sg, 764: th}
    prefix: trade_ch_x
    backfill_months: 36
    recheck_months: 3
    lag_months: 2
    pause_seconds: 4
    release_lag_days: 75
    schedule: weekly
    stale_after_days: 150
    status: candidate
    note: "Swiss gold exports by destination, tonnes a month (UN Comtrade HS 7108, free preview API)."
  trade_in_imports:
    fetcher: comtrade_monthly
    reporter: 699
    flow: M
    partners: {0: total}
    prefix: trade_in_m
    backfill_months: 36
    recheck_months: 3
    lag_months: 2
    pause_seconds: 4
    release_lag_days: 75
    schedule: weekly
    stale_after_days: 150
    status: candidate
    note: "India's gold imports, tonnes a month (UN Comtrade HS 7108)."
  trade_hk_to_cn:
    fetcher: comtrade_monthly
    reporter: 344
    flow: X
    partners: {156: cn}
    prefix: trade_hk_x
    backfill_months: 36
    recheck_months: 3
    lag_months: 2
    pause_seconds: 4
    release_lag_days: 75
    schedule: weekly
    stale_after_days: 150
    status: candidate
    note: "Hong Kong's gold exports to mainland China, tonnes a month (UN Comtrade HS 7108)."
  gld_holdings:
    fetcher: gld_holdings
    url: "https://api.spdrgoldshares.com/api/v1/historical-archive?product=gld&exchange=NYSE&lang=en"
    schedule: daily
    stale_after_days: 7
    status: candidate
    note: "SPDR Gold Shares (GLD) holdings in tonnes, daily, from the issuer's archive workbook."
  # Reserves excluding gold (IMF via FRED), millions of US dollars: the non-gold part of each central bank's reserves
  res_exgold_cn: {fetcher: fred, fred_id: TRESEGCNM052N, period: month, scale: 1000000, release_lag_days: 45, schedule: weekly, stale_after_days: 120, status: candidate, note: "Reserves excluding gold, China, millions of USD (IMF IFS via FRED)"}
  res_exgold_in: {fetcher: fred, fred_id: TRESEGINM052N, period: month, scale: 1000000, release_lag_days: 45, schedule: weekly, stale_after_days: 120, status: candidate, note: "Reserves excluding gold, India, millions of USD (IMF IFS via FRED)"}
  res_exgold_pl: {fetcher: fred, fred_id: TRESEGPLM052N, period: month, scale: 1000000, release_lag_days: 45, schedule: weekly, stale_after_days: 120, status: candidate, note: "Reserves excluding gold, Poland, millions of USD (IMF IFS via FRED)"}
  res_exgold_tr: {fetcher: fred, fred_id: TRESEGTRM052N, period: month, scale: 1000000, release_lag_days: 45, schedule: weekly, stale_after_days: 120, status: candidate, note: "Reserves excluding gold, Türkiye, millions of USD (IMF IFS via FRED)"}
  res_exgold_ru: {fetcher: fred, fred_id: TRESEGRUM052N, period: month, scale: 1000000, release_lag_days: 45, schedule: weekly, stale_after_days: 120, status: candidate, note: "Reserves excluding gold, Russia, millions of USD (IMF IFS via FRED)"}
  res_exgold_jp: {fetcher: fred, fred_id: TRESEGJPM052N, period: month, scale: 1000000, release_lag_days: 45, schedule: weekly, stale_after_days: 120, status: candidate, note: "Reserves excluding gold, Japan, millions of USD (IMF IFS via FRED)"}
  res_exgold_us: {fetcher: fred, fred_id: TRESEGUSM052N, period: month, scale: 1000000, release_lag_days: 45, schedule: weekly, stale_after_days: 120, status: candidate, note: "Reserves excluding gold, United States, millions of USD (IMF IFS via FRED)"}
  res_exgold_de: {fetcher: fred, fred_id: TRESEGDEM052N, period: month, scale: 1000000, release_lag_days: 45, schedule: weekly, stale_after_days: 120, status: candidate, note: "Reserves excluding gold, Germany, millions of USD (IMF IFS via FRED)"}
  ch_10y_yield:       {fetcher: fred, fred_id: IRLTLT01CHM156N, period: month, release_lag_days: 35, schedule: weekly, stale_after_days: 75, status: candidate, note: "Swiss 10-year government bond yield, % (OECD via FRED); the opportunity cost of holding gold in francs"}
  ch_cpi_yoy_snb:     {fetcher: snb_cube, cube: plkopr, dim: VVP, release_lag_days: 25, schedule: weekly, stale_after_days: 75, status: candidate, note: "Swiss consumer price inflation, % on a year earlier (SNB data portal, cube plkopr, VVP); FRED's OECD copy stopped in April 2025"}
  real_yield_10y:     {fetcher: fred, fred_id: DFII10,   period: day,   release_lag_days: 1,  schedule: daily, stale_after_days: 7,  status: candidate, note: "10-year TIPS real yield, from 2003"}
  breakeven_10y:      {fetcher: fred, fred_id: T10YIE,   period: day,   release_lag_days: 1,  schedule: daily, stale_after_days: 7,  status: candidate, note: "10-year breakeven inflation"}
  dollar_broad:       {fetcher: fred, fred_id: DTWEXBGS, period: day,   release_lag_days: 7,  schedule: daily, stale_after_days: 14, status: candidate, note: "Broad trade-weighted dollar (weekly H.10 release)"}
  vix_fred:           {fetcher: fred, fred_id: VIXCLS,   period: day,   release_lag_days: 1,  schedule: daily, stale_after_days: 7,  status: candidate, note: "VIX, FRED copy"}
  gold_vol:           {fetcher: fred, fred_id: GVZCLS,   period: day,   release_lag_days: 1,  schedule: daily, stale_after_days: 7,  status: candidate, note: "CBOE gold ETF volatility index"}
  fed_funds_eff:      {fetcher: fred, fred_id: DFF,      period: day,   release_lag_days: 1,  schedule: daily, stale_after_days: 7,  status: candidate, note: "Effective fed funds rate; shows FOMC decisions"}
  fed_target_upper:   {fetcher: fred, fred_id: DFEDTARU, period: day,   release_lag_days: 0,  schedule: on_release, stale_after_days: 60, status: candidate, note: "Fed funds target range, upper bound"}
  us_cpi_fred:        {fetcher: fred, fred_id: CPIAUCNS, period: month, release_lag_days: 15, schedule: on_release, stale_after_days: 50, status: candidate, note: "US CPI-U NSA (official source for the mirror above)"}
  us_core_cpi:        {fetcher: fred, fred_id: CPILFESL, period: month, release_lag_days: 15, schedule: on_release, stale_after_days: 50, status: candidate, note: "US core CPI, SA"}
  us_payrolls:        {fetcher: fred, fred_id: PAYEMS,   period: month, release_lag_days: 7,  schedule: on_release, stale_after_days: 45, status: candidate, note: "Nonfarm payrolls, thousands, SA; revised for two months"}
  us_unemployment:    {fetcher: fred, fred_id: UNRATE,   period: month, release_lag_days: 7,  schedule: on_release, stale_after_days: 45, status: candidate, note: "Unemployment rate"}
  usdchf_fred:        {fetcher: fred, fred_id: DEXSZUS,  period: day,   release_lag_days: 7,  schedule: daily, stale_after_days: 14, status: candidate, note: "CHF per USD (official H.10 source)"}
  cftc_cot:
    fetcher: cftc_disagg
    markets: {gold: "088691", silver: "084691", platinum: "076651", copper: "085692"}
    years_back: 0                 # set to 20 once (or run `pmdash backfill --cftc-years 20`) for history from 2006
    schedule: on_release
    stale_after_days: 10
    status: candidate
    note: CFTC disaggregated futures-only COT; managed money, producers, open interest.
  gpr_monthly:
    fetcher: excel
    url: https://www.matteoiacoviello.com/gpr_files/data_gpr_export.xls
    date_col: month
    value_col: GPR
    period: month
    release_lag_days: 10
    schedule: weekly
    stale_after_days: 45
    status: candidate
    note: Caldara-Iacoviello geopolitical risk index, monthly from 1985 (historical GPRH from 1900).
  gpr_daily:
    fetcher: excel
    url: https://www.matteoiacoviello.com/gpr_files/data_gpr_daily_recent.xls
    date_col: date
    value_col: GPRD
    period: day
    release_lag_days: 7
    schedule: weekly
    stale_after_days: 21
    status: candidate
    note: Daily geopolitical risk index.

  # --- daily prices (technical indicators): candidates, run on GitHub Actions --------------------
  gold_fut_daily:
    fetcher: yahoo_chart
    ticker: GC=F
    prefix: gold_fut
    start: "2000-08-30"
    schedule: daily
    stale_after_days: 5
    status: candidate
    note: COMEX gold front-month continuation (Yahoo Finance, unofficial, prototyping only). OHLC + volume.
  silver_fut_daily:
    fetcher: yahoo_chart
    ticker: SI=F
    prefix: silver_fut
    start: "2000-08-30"
    schedule: daily
    stale_after_days: 5
    status: candidate
    note: COMEX silver front-month continuation (Yahoo Finance, unofficial).
  usdchf_yahoo_daily:
    fetcher: yahoo_chart
    ticker: CHF=X
    prefix: usdchf_yf
    start: "2003-12-01"
    schedule: daily
    stale_after_days: 5
    status: candidate
    note: Francs per dollar, daily (Yahoo Finance, unofficial). Fresher than FRED's weekly H.10 release; used for today's franc prices at the top of the page.
  gold_spot_daily:
    fetcher: stooq_daily
    symbol: xauusd
    prefix: gold_spot
    schedule: fallback        # not run daily: stooq.com answered with a bot-check page in Oct 2026
    stale_after_days: 5
    status: candidate
    note: Gold spot USD (stooq.com), fallback when Yahoo refuses. OHLC, no volume.
  silver_spot_daily:
    fetcher: stooq_daily
    symbol: xagusd
    prefix: silver_spot
    schedule: fallback
    stale_after_days: 5
    status: candidate
    note: Silver spot USD (stooq.com).

  # --- reports whose terms rule out scraping: entered by hand ---------------------------------
  manual_reports:
    fetcher: manual
    path: data/manual/report_figures.csv
    schedule: daily
    status: manual
    note: WGC Gold Demand Trends, WGC central bank survey, Silver Institute World Silver Survey, IMF COFER, China PMI. See data/manual/README.md.

retry:
  attempts: 4
  backoff_seconds: [2, 4, 8, 16]
  timeout_seconds: 30
