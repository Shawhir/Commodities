# Candidate sources to test from GitHub Actions (the dev sandbox cannot reach them).
# `pmdash probe` downloads each and saves status, CORS headers and the first bytes under
# data/research/probe/. {FRED_API_KEY} is filled from the environment and never written out.
urls:
  snb_plkopr: "https://data.snb.ch/api/cube/plkopr/data/csv/en"
  snb_plkoprinfla: "https://data.snb.ch/api/cube/plkoprinfla/data/csv/en"
  snb_plkoprex: "https://data.snb.ch/api/cube/plkoprex/data/csv/en"
  snb_rendoblim: "https://data.snb.ch/api/cube/rendoblim/data/csv/en"
  fred_ch_cpi_search: "https://api.stlouisfed.org/fred/series/search?search_text=switzerland%20consumer%20price&api_key={FRED_API_KEY}&file_type=json&limit=40&order_by=last_updated"
