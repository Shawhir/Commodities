[project]
name = "pmdash"
version = "0.1.0"
description = "Personal precious metals dashboard: regimes, key lines, analogues. Descriptive, not predictive."
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "duckdb>=1.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.30"]
dev = ["pytest>=7"]

[project.scripts]
pmdash = "pmdash.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
